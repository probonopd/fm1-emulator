name: Emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push runs on its HEAD commit only; a newer push cancels the older run,
# so only the newest commit is built and released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS 27 runs only under the xcode-27 label (a public preview).
jobs:
  build:
    name: Build (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            package: macos-arm64
          - os: ubuntu-26.04
            package: linux-amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: python
      - name: Build
        run: mise run build
      - name: Test
        run: mise run test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fm1-emulator-${{ matrix.package }}
          path: .cache/fm1-emulator-${{ matrix.package }}.tar.gz
          if-no-files-found: error

  firmware:
    name: Firmware (${{ matrix.firmware.name }}, ${{ matrix.platform.package }})
    needs: build
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: xcode-27
            package: macos-arm64
          - os: ubuntu-26.04
            package: linux-amd64
        firmware:
          - name: Felucca 1.5
            url: https://github.com/hugelton/Felucca/releases/download/v1.5/felucca-1.5.fwsc
          - name: FM-1
            url: https://yms-file-store.oss-cn-hongkong.aliyuncs.com/software/firmware/FM-1.fwsc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fm1-emulator-${{ matrix.platform.package }}
          path: .cache
      - name: Extract binary
        run: tar -xzf .cache/fm1-emulator-${{ matrix.platform.package }}.tar.gz emulator
      - name: Download firmware
        env:
          FIRMWARE_URL: ${{ matrix.firmware.url }}
        run: curl --fail --location --retry 3 --output .cache/firmware.fwsc "$FIRMWARE_URL"
      - name: Stress
        id: stress
        run: mise run stress .cache/firmware.fwsc
      - name: Panel smoke
        if: ${{ !cancelled() && steps.stress.outcome != 'skipped' }}
        run: mise run panel_smoke .cache/firmware.fwsc

  release:
    name: Release
    # Every push to main, once every build and firmware job passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, firmware]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fm1-emulator-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-$GITHUB_RUN_NUMBER" dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA::7})" --generate-notes
